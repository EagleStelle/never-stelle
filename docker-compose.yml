services:
  never-stelle:
    image: eaglestelle/never-stelle:latest
    build: .
    container_name: never-stelle
    restart: unless-stopped
    environment:
      NEVER_STELLE_USERNAME: ${NEVER_STELLE_USERNAME:-root}
      NEVER_STELLE_PASSWORD: ${NEVER_STELLE_PASSWORD:-never-stelle}
      NEVER_STELLE_MAX_CONCURRENT: ${NEVER_STELLE_MAX_CONCURRENT:-3}
      NEVER_STELLE_COOKIE_SECURE: ${NEVER_STELLE_COOKIE_SECURE:-0}
      SWARATELLE_URL: ${SWARATELLE_URL:-http://localhost:8842}
      SWARATELLE_API_TOKEN: ${SWARATELLE_API_TOKEN:-replace-this-with-a-long-random-token}
    volumes:
      - .local/data:/data
      - .local/scratch:/scratch
      - .local/media:/media
      # Optional: redirect one platform to another disk. Container path must be /media/<source-key>.
      # - /volume1/facebook:/media/facebook
      # - /volume1/youtube:/media/youtube
    ports:
      - "8840:8840"
