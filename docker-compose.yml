services:
  never-stelle:
    image: eaglestelle/never-stelle:latest
    build: .
    container_name: never-stelle
    restart: unless-stopped
    volumes:
      - .local/data:/data
      - .local/scratch:/scratch
      - .local/media:/media
      # Optional: redirect one platform to another disk. Container path must be /media/<source-key>.
      # - /volume1/facebook:/media/facebook
      # - /volume1/youtube:/media/youtube
    ports:
      - "8840:8840"
